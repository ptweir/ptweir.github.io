<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MazeBoom - Kids Maze Adventure</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Welcome Screen -->
        <div id="welcome-screen" class="screen active">
            <div class="content">
                <h1 class="game-title">🌟 MazeBoom! 🌟</h1>
                <p class="game-subtitle">Help collect yummy foods for your picnic!</p>
                <button id="start-btn" class="big-button">Start Adventure!</button>
            </div>
        </div>

        <!-- Maze Screen -->
        <div id="maze-screen" class="screen">
            <div class="game-header">
                <div class="basket-counter">
                    🧺 Basket: <span id="basket-count">0</span> foods
                </div>
                <div class="maze-counter">
                    Maze <span id="maze-number">1</span>
                </div>
            </div>
            <div class="maze-instruction">
                <p>Trace the path from 🏠 to 🎯 with your finger!</p>
            </div>
            <canvas id="maze-canvas"></canvas>
            <div class="maze-controls">
                <button id="reset-maze-btn" class="control-button">Reset Path</button>
                <button id="new-maze-btn" class="control-button">New Maze</button>
            </div>
        </div>

        <!-- Food Selection Screen -->
        <div id="food-screen" class="screen">
            <div class="content">
                <h2>🎉 Maze Complete! 🎉</h2>
                <p>Pick a yummy food for your picnic basket:</p>
                <div id="food-grid" class="food-grid">
                    <!-- Food items will be generated by JavaScript -->
                </div>
                <div class="food-controls">
                    <button id="continue-adventure-btn" class="big-button">Continue Adventure!</button>
                    <button id="finish-adventure-btn" class="big-button secondary">Go to Picnic!</button>
                </div>
            </div>
        </div>

        <!-- Picnic Screen -->
        <div id="picnic-screen" class="screen">
            <div class="content">
                <h2>🌿 Picnic Time! 🌿</h2>
                <p>Enjoy your feast with all the foods you collected!</p>
                <div id="picnic-basket" class="picnic-basket">
                    <!-- Collected foods will be displayed here -->
                </div>
                <div class="picnic-controls">
                    <button id="play-again-btn" class="big-button">Play Again!</button>
                </div>
            </div>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="success-message">
            <div class="success-content">
                <h3>🎯 Amazing! 🎯</h3>
                <p>You solved the maze!</p>
            </div>
        </div>
    </div>

    <script src="js/maze.js"></script>
    <script src="js/food.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
