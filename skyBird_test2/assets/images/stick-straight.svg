<svg width="60" height="8" viewBox="0 0 60 8" xmlns="http://www.w3.org/2000/svg">
  <!-- Straight stick -->
  <rect x="0" y="0" width="60" height="8" rx="4" fill="#8B4513" stroke="#654321" stroke-width="1"/>
  
  <!-- Wood grain lines -->
  <line x1="5" y1="2" x2="55" y2="2" stroke="#654321" stroke-width="0.5" opacity="0.6"/>
  <line x1="8" y1="6" x2="52" y2="6" stroke="#654321" stroke-width="0.5" opacity="0.6"/>
  
  <!-- Small knots -->
  <circle cx="15" cy="4" r="1" fill="#654321" opacity="0.7"/>
  <circle cx="45" cy="4" r="1" fill="#654321" opacity="0.7"/>
</svg>
