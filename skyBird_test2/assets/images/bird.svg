<svg width="60" height="40" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Bird body -->
  <ellipse cx="30" cy="20" rx="25" ry="15" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  
  <!-- Wing -->
  <ellipse cx="35" cy="18" rx="12" ry="8" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
  
  <!-- Eye -->
  <circle cx="40" cy="15" r="4" fill="white"/>
  <circle cx="42" cy="15" r="2" fill="black"/>
  
  <!-- Beak -->
  <polygon points="50,18 58,15 58,21" fill="#FF6B35"/>
  
  <!-- Tail feathers -->
  <ellipse cx="8" cy="20" rx="8" ry="5" fill="#FFA500" stroke="#FF8C00" stroke-width="1"/>
</svg>
